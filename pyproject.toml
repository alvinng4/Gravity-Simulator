[project]
name = "grav_sim"
version = "1.0.1"
description = "N-body gravity simulation library with C and Python API"
readme = "README.md"
authors = [
    { name = "Ching-Yin Ng", email = "alvinng324@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "cmake>=3.10.0",
    "h5py>=3.0.0",
    "matplotlib>=3.8.3",
    "numpy>=1.26.4",
]

[dependency-groups]
dev = [
    "poethepoet>=0.37.0",
    "pytest>=8.4.2",
    "ruff>=0.16.5",
    "ty>=0.0.89",
]
mkdocs = [
    "mkdocs-bibtex>=4.4.0",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
    "mkdocs-same-dir>=0.1.4",
    "mkdocstrings[python]>=0.30.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "grav_sim"

[tool.poe.tasks]
format = "ruff format"
lint   = "ruff check"
types  = "ty check"

[tool.poe.tasks.clean]
sequence = ["format", "lint", "types"]
ignore_fail = "return_non_zero"
help = "Run format, lint, and type checks"
